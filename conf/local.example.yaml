server:
  port: "8080"
  trust_proxy_headers: false

database:
  host: "localhost"
  port: "54323"
  user: "postgres"
  password: "123456"
  name: "sso-server"
  sslmode: "disable"

cache:
  url: "redis://:123456@localhost:63783"

security:
  access_token_expire: "12h"

auth:
  otp_expire: "5m"
  otp_max_attempts: 5
  access_token_ttl: "15m"
  refresh_token_ttl: "720h"
  password_min_length: 12
  password_account_fail_limit: 5
  password_device_fail_limit: 20
  password_ip_fail_limit: 100
  password_account_fail_window: "10m"
  password_device_fail_window: "10m"
  password_ip_fail_window: "1h"

message_center:
  url: "https://message-center.example.com"
  api_key: "replace-with-api-client-key"
  sender_key: "noreply"

dev:
  skip_send_message: true
  fixed_email_otp: "123456"

oauth:
  github:
    client_id: "github-client-id"
    client_secret: "github-client-secret"
    redirect_uri: "http://localhost:8080/api/auth/third/github/callback"
  feishu:
    client_id: "feishu-client-id"
    client_secret: "feishu-client-secret"
    redirect_uri: "http://localhost:8080/api/auth/third/feishu/callback"

admin:
  user_ids:
    - "replace-with-user-id"
