name: Clean Vercel Container Registry

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      DRY_RUN:
        description: 'Only show deletion candidates without deleting them'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: sso-vercel-main
  cancel-in-progress: false

jobs:
  cleanup:
    name: Clean Vercel Container Registry
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.DRY_RUN && 'true' || 'false' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@59.6.2

      - name: Validate Vercel configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${VERCEL_TOKEN:?VERCEL_TOKEN is not configured for the production environment}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is not configured for the production environment}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is not configured for the production environment}"

          if ! vercel whoami --non-interactive --no-color >/dev/null 2>&1; then
            echo "::error title=Unsupported Vercel token scope::VERCEL_TOKEN must be a valid team-scoped token."
            exit 1
          fi

          if ! vercel project inspect "$VERCEL_PROJECT_ID" \
            --scope="$VERCEL_ORG_ID" \
            --non-interactive \
            --no-color >/dev/null 2>&1; then
            echo "::error title=Vercel project access failed::VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID do not resolve to an accessible project."
            exit 1
          fi

      - name: Resolve current Production image
        shell: bash
        run: |
          set -euo pipefail

          production_deployments="$(
            vercel ls "$VERCEL_PROJECT_ID" \
              --prod \
              --status=READY \
              --limit=1 \
              --json \
              --scope="$VERCEL_ORG_ID" \
              --non-interactive \
              --no-color
          )"
          production_commit="$(
            jq -r '
              (if type == "array" then . else .deployments // [] end)
              | .[0].meta.githubCommitSha
              // .[0].meta.gitlabCommitSha
              // .[0].meta.bitbucketCommitSha
              // empty
            ' <<< "$production_deployments"
          )"

          if [[ -z "$production_commit" ]]; then
            echo "ERROR: Production deployment has no Git commit SHA. Cleanup is aborted."
            exit 1
          fi

          production_tag="${production_commit:0:12}"
          printf 'PRODUCTION_TAG=%s\n' "$production_tag" >> "$GITHUB_ENV"
          echo "Expected Production VCR tag: ${production_tag}"

      - name: Fetch VCR images
        shell: bash
        run: |
          set -euo pipefail

          repository="dockerfile"
          image_records_file="${RUNNER_TEMP}/vercel-vcr-images.jsonl"
          sorted_images_file="${RUNNER_TEMP}/vercel-vcr-images.sorted.jsonl"
          : > "$image_records_file"

          vcr_arguments=(
            --project="$VERCEL_PROJECT_ID"
            --scope="$VERCEL_ORG_ID"
            --non-interactive
            --no-color
          )

          echo "Fetching VCR images..."
          next_cursor=""
          while :; do
            list_arguments=(
              vcr image ls "$repository"
              "${vcr_arguments[@]}"
              --limit=100
              --json
            )
            if [[ -n "$next_cursor" ]]; then
              list_arguments+=(--next="$next_cursor")
            fi

            image_page="$(vercel "${list_arguments[@]}")"
            jq -e '.images | type == "array"' >/dev/null <<< "$image_page"
            jq -c '.images[]' <<< "$image_page" >> "$image_records_file"

            next_cursor="$(jq -r '.nextCursor // empty' <<< "$image_page")"
            [[ -z "$next_cursor" ]] && break
          done

          jq -sc 'sort_by(.createdAt) | reverse | .[]' "$image_records_file" > "$sorted_images_file"
          printf 'VCR_IMAGES_FILE=%s\n' "$sorted_images_file" >> "$GITHUB_ENV"

      - name: Clean obsolete registry images
        shell: bash
        run: |
          set -euo pipefail

          repository="dockerfile"
          keep_count=10
          keep_days=3

          : "${PRODUCTION_TAG:?PRODUCTION_TAG was not resolved}"
          : "${VCR_IMAGES_FILE:?VCR_IMAGES_FILE was not created}"

          production_image_id="$(
            jq -rs --arg tag "$PRODUCTION_TAG" '
              map(select(.tags | index($tag)))
              | .[0].id // empty
            ' "$VCR_IMAGES_FILE"
          )"
          if [[ -z "$production_image_id" ]]; then
            echo "ERROR: cannot find the VCR image for the Production tag: ${PRODUCTION_TAG}"
            echo "Cleanup is aborted to avoid deleting the Production image."
            exit 1
          fi

          latest_image_id="$(
            jq -rs --arg tag latest '
              map(select(.tags | index($tag)))
              | .[0].id // empty
            ' "$VCR_IMAGES_FILE"
          )"
          if [[ -n "$latest_image_id" ]]; then
            echo "latest image: ${latest_image_id}"
          else
            echo "No latest tag exists."
          fi

          vcr_arguments=(
            --project="$VERCEL_PROJECT_ID"
            --scope="$VERCEL_ORG_ID"
            --non-interactive
            --no-color
          )
          cutoff="$(date -u -d "${keep_days} days ago" +%s)"

          echo "============================================================"
          echo "Cleanup (dry run: ${DRY_RUN})"
          echo "============================================================"

          index=0
          while IFS= read -r image; do
            index=$((index + 1))
            image_id="$(jq -r '.id' <<< "$image")"
            created_at="$(jq -r '.createdAt' <<< "$image")"
            tags="$(jq -r '.tags | if length == 0 then "<none>" else join(", ") end' <<< "$image")"

            echo "[${index}] image=${image_id} tags=${tags} created=${created_at}"

            if (( index <= keep_count )); then
              echo "KEEP: newest ${keep_count}"
              continue
            fi

            if [[ "$image_id" == "$latest_image_id" ]]; then
              echo "KEEP: latest tag"
              continue
            fi

            if [[ "$image_id" == "$production_image_id" ]]; then
              echo "KEEP: currently used by Production"
              continue
            fi

            if [[ "$created_at" =~ ^[0-9]+$ ]]; then
              created_timestamp="$created_at"
              if (( created_timestamp > 100000000000 )); then
                created_timestamp=$((created_timestamp / 1000))
              fi
            else
              created_timestamp="$(date -u -d "$created_at" +%s)"
            fi

            if (( created_timestamp >= cutoff )); then
              echo "KEEP: newer than ${keep_days} days"
              continue
            fi

            echo "DELETE candidate"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "DRY RUN: skip deletion"
              continue
            fi

            vercel vcr image rm "$repository" "$image_id" \
              "${vcr_arguments[@]}" \
              --yes \
              --json
            echo "DELETED"
          done < "$VCR_IMAGES_FILE"
