name: Deploy to Vercel

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: sso-vercel-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    env:
      APP_ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'test' }}
      VERCEL_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install Vercel CLI
        run: npm install --global vercel@59.5.0

      - name: Validate Vercel configuration
        shell: bash
        run: |
          : "${VERCEL_TOKEN:?VERCEL_TOKEN is not configured for the ${VERCEL_ENVIRONMENT} environment}"
          : "${VERCEL_ORG_ID:?VERCEL_ORG_ID is not configured for the ${VERCEL_ENVIRONMENT} environment}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID is not configured for the ${VERCEL_ENVIRONMENT} environment}"
          if ! vercel whoami --non-interactive --no-color >/dev/null 2>&1; then
            echo "::error title=Unsupported Vercel token scope::VERCEL_TOKEN must be a valid team-scoped token. Vercel CLI 59.x cannot use a project-scoped token with pull or env run."
            exit 1
          fi
          if ! vercel project inspect "$VERCEL_PROJECT_ID" \
            --scope="$VERCEL_ORG_ID" \
            --non-interactive \
            --no-color >/dev/null 2>&1; then
            echo "::error title=Vercel project access failed::VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID do not resolve to an accessible project."
            exit 1
          fi

      - name: Pull project settings
        shell: bash
        run: |
          pull_args=(
            --yes
            "--environment=$VERCEL_ENVIRONMENT"
            "--project=$VERCEL_PROJECT_ID"
          )
          if [[ "$VERCEL_ENVIRONMENT" == "preview" ]]; then
            pull_args+=("--git-branch=$GITHUB_REF_NAME")
          fi
          vercel pull "${pull_args[@]}"

      - name: Apply migrations
        shell: bash
        run: |
          env_args=(
            "--environment=$VERCEL_ENVIRONMENT"
            "--project=$VERCEL_PROJECT_ID"
          )
          if [[ "$VERCEL_ENVIRONMENT" == "preview" ]]; then
            env_args+=("--git-branch=$GITHUB_REF_NAME")
          fi
          vercel env run "${env_args[@]}" -- env \
            ENV="$APP_ENVIRONMENT" \
            GOCACHE="$RUNNER_TEMP/go-cache" \
            bash -c '
              set -euo pipefail
              : "${DATABASE_HOST:?DATABASE_HOST is not configured in Vercel}"
              : "${DATABASE_PORT:?DATABASE_PORT is not configured in Vercel}"
              : "${DATABASE_USER:?DATABASE_USER is not configured in Vercel}"
              : "${DATABASE_PASSWORD:?DATABASE_PASSWORD is not configured in Vercel}"
              : "${DATABASE_NAME:?DATABASE_NAME is not configured in Vercel}"
              : "${DB_SSLMODE:?DB_SSLMODE is not configured in Vercel}"
              exec go run ./cmd/migrate up
            '

      - name: Deploy
        shell: bash
        run: |
          deploy_args=(
            --yes
            "--project=$VERCEL_PROJECT_ID"
          )
          if [[ "$VERCEL_ENVIRONMENT" == "production" ]]; then
            deploy_args+=(--prod)
          fi
          vercel deploy "${deploy_args[@]}"
